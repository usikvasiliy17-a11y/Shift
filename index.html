/* ============================================================
   DESIGN TOKENS
   ============================================================ */
const C = {
  bg: "#0F1419",
  bg2: "#0B0F14",
  surface: "#171D26",
  surface2: "#1F2733",
  surface3: "#252F3D",
  line: "#2A3441",
  text: "#E8ECF1",
  textMute: "#8B95A5",
  textFaint: "#5B6472",
  day: "#E8A94C",
  dayDim: "#4A3D28",
  night: "#7C8FE0",
  nightDim: "#2B2F4A",
  recovery: "#7FA88F",
  recoveryDim: "#2A3830",
  off: "#6B7688",
  offDim: "#242B35",
  danger: "#D9776B",
  dangerDim: "#3A2622",
  gold: "#D4B26A",
};

const TYPE_META = {
  day: { emoji: "☀️", label: "Дневная", short: "День", color: C.day, dim: C.dayDim, Icon: Sun },
  night: { emoji: "🌙", label: "Ночная", short: "Ночь", color: C.night, dim: C.nightDim, Icon: Moon },
  recovery: { emoji: "🛌", label: "Отсыпной", short: "Отс", color: C.recovery, dim: C.recoveryDim, Icon: BedDouble },
  off: { emoji: "○", label: "Выходной", short: "Вых", color: C.off, dim: C.offDim, Icon: Circle },
};

const EVENT_META = {
  task: { emoji: "📝", label: "Задача", Icon: ClipboardList, color: "#9AA5B8" },
  workout: { emoji: "🏋️", label: "Тренировка", Icon: Dumbbell, color: "#E0955C" },
  trip: { emoji: "🚗", label: "Поездка", Icon: Car, color: "#6FB0C4" },
  vacation: { emoji: "🏖", label: "Отпуск", Icon: Palmtree, color: "#7FA88F" },
  event: { emoji: "📅", label: "Событие", Icon: CalendarDays, color: "#B79AE0" },
  goal: { emoji: "🎯", label: "Цель", Icon: Target, color: C.gold },
};

const CYCLE = ["day", "day", "off", "night", "night", "recovery", "off", "off"];
const ANCHOR = new Date(2026, 7, 5); // 5 Aug 2026 == cycle index 0

/* ============================================================
   DATE / ENGINE HELPERS
   ============================================================ */
const MS_DAY = 86400000;
function toKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function keyToDate(k) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}
function fmtDay(d) {
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}
function fmtDayShort(d) {
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
}
function fmtWeekday(d) {
  const s = d.toLocaleDateString("ru-RU", { weekday: "short" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function cycleIndex(d) {
  const diff = Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - ANCHOR) / MS_DAY);
  return ((diff % 8) + 8) % 8;
}
function dayType(d) {
  return CYCLE[cycleIndex(d)];
}
function t2m(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function m2t(m) {
  m = ((m % 1440) + 1440) % 1440;
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}

const BASE_FREE = {
  day: [["06:00", "08:45"], ["21:15", "23:30"]],
  night: [["11:00", "17:30"]],
  recovery: [["15:00", "23:00"]],
  off: [["08:00", "23:30"]],
};
const WORK_HOURS = {
  day: ["09:00", "21:00"],
  night: ["21:00", "09:00"],
};

function subtractInterval(windows, busyStart, busyEnd) {
  const out = [];
  for (const [s, e] of windows) {
    if (busyEnd <= s || busyStart >= e) { out.push([s, e]); continue; }
    if (busyStart > s) out.push([s, busyStart]);
    if (busyEnd < e) out.push([busyEnd, e]);
  }
  return out.filter(([s, e]) => e - s >= 10);
}

/* ============================================================
   ROOT APP
   ============================================================ */
function App() {
  const now = new Date();
  const today = useMemo(() => new Date(now.getFullYear(), now.getMonth(), now.getDate()), [now.toDateString()]);

  const [events, setEvents] = useState(() => {
    try {
      const saved = localStorage.getItem("shift.events");
      return saved ? JSON.parse(saved) : seedEvents(today);
    } catch {
      return seedEvents();
    }
  });

  useEffect(() => {
    try { localStorage.setItem("shift.events", JSON.stringify(events)); } catch {}
  }, [events]);
  const [tab, setTab] = useState("rhythm");
  const [addOpen, setAddOpen] = useState(false);
  const [scenario, setScenario] = useState(null); // active quick-scenario id
  const [conflict, setConflict] = useState(null); // pending conflict payload
  const [toast, setToast] = useState(null);
  const [prefNudge, setPrefNudge] = useState(true);

  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 2600);
    return () => clearTimeout(id);
  }, [toast]);

  function eventsOn(key) {
    return events.filter((e) => e.date === key || (e.endDate && key >= e.date && key <= e.endDate));
  }

  function getFreeWindows(key) {
    const d = keyToDate(key);
    const type = dayType(d);
    let windows = BASE_FREE[type].map(([s, e]) => [t2m(s), t2m(e)]);
    for (const ev of eventsOn(key)) {
      if (!ev.time) continue;
      const s = t2m(ev.time);
      const e = s + (ev.duration || 60);
      windows = windows.flatMap((w) => subtractInterval([w], s, e));
    }
    return windows.map(([s, e]) => [m2t(s), m2t(e)]);
  }

  function checkConflict(key, time, duration) {
    const d = keyToDate(key);
    const type = dayType(d);
    const s = t2m(time), e = s + duration;
    if (type === "day" || type === "night") {
      const [ws, we] = WORK_HOURS[type];
      let wStart = t2m(ws), wEnd = t2m(we);
      const overlapsWork = type === "night"
        ? (s < wEnd || e > wStart || wEnd < wStart) && !(e <= wStart && s >= wEnd)
        : s < wEnd && e > wStart;
      if (type === "night") {
        // night shift spans 21:00->09:00 next day; treat as busy outside 11:00-17:30 free window
        const freeS = t2m("11:00"), freeE = t2m("17:30");
        if (!(s >= freeS && e <= freeE)) {
          return { kind: "shift", type, work: `${ws} → ${we}` };
        }
      } else if (overlapsWork) {
        return { kind: "shift", type, work: `${ws}–${we}` };
      }
    }
    if (type === "recovery" && s < t2m("15:00")) {
      return { kind: "recovery" };
    }
    for (const ev of eventsOn(key)) {
      if (!ev.time) continue;
      const es = t2m(ev.time), ee = es + (ev.duration || 60);
      if (s < ee && e > es) return { kind: "event", other: ev };
    }
    return null;
  }

  function commitEvent(ev, { force } = {}) {
    if (!force && ev.time) {
      const c = checkConflict(ev.date, ev.time, ev.duration || 60);
      if (c) {
        setConflict({ ev, c });
        return false;
      }
    }
    setEvents((prev) => [...prev, { ...ev, id: crypto.randomUUID() }]);
    setToast(`Добавлено: ${ev.title}`);
    return true;
  }

  function addMany(evs) {
    setEvents((prev) => [...prev, ...evs.map((e) => ({ ...e, id: crypto.randomUUID() }))]);
    setToast(`Добавлено событий: ${evs.length}`);
  }

  const ctx = {
    today, events, eventsOn, getFreeWindows, checkConflict, commitEvent, addMany,
    setToast,
  };

  return (
    <div className="shift-app" style={{ background: C.bg, minHeight: "100vh", color: C.text }}>
      <FontStyles />
      <div style={{ maxWidth: 460, margin: "0 auto", position: "relative", minHeight: "100vh", paddingBottom: 92 }}>
        <TopBar today={today} />

        <div style={{ padding: "0 16px" }}>
          {tab === "rhythm" && <RhythmScreen ctx={ctx} prefNudge={prefNudge} setPrefNudge={setPrefNudge} />}
          {tab === "calendar" && <CalendarScreen ctx={ctx} onAdd={() => setAddOpen(true)} />}
          {tab === "planner" && <PlannerScreen ctx={ctx} scenario={scenario} setScenario={setScenario} />}
          {tab === "month" && <MonthScreen ctx={ctx} />}
        </div>

        <button
          onClick={() => setAddOpen(true)}
          aria-label="Добавить событие"
          style={{
            position: "fixed", right: "50%", transform: "translateX(214px)", bottom: 92,
            width: 56, height: 56, borderRadius: 999, background: C.gold, color: "#1A1607",
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 8px 24px rgba(212,178,106,0.35)", border: "none", cursor: "pointer", zIndex: 40,
          }}
        >
          <Plus size={26} strokeWidth={2.4} />
        </button>

        <BottomNav tab={tab} setTab={setTab} />

        {addOpen && <AddEventSheet ctx={ctx} onClose={() => setAddOpen(false)} />}
        {conflict && (
          <ConflictModal
            data={conflict}
            onCancel={() => setConflict(null)}
            onForce={() => { commitEvent(conflict.ev, { force: true }); setConflict(null); }}
            onReschedule={() => setConflict(null)}
          />
        )}
        {toast && <Toast text={toast} />}
      </div>
    </div>
  );
}

function FontStyles() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
      .shift-app { font-family: 'Inter', sans-serif; }
      .f-display { font-family: 'Space Grotesk', sans-serif; }
      .f-mono { font-family: 'IBM Plex Mono', monospace; }
      .shift-app * { box-sizing: border-box; }
      .shift-app ::-webkit-scrollbar { height: 0; width: 0; }
      .scroller { -ms-overflow-style: none; scrollbar-width: none; }
      .scroller::-webkit-scrollbar { display: none; }
      @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(212,178,106,0.45); } 70% { box-shadow: 0 0 0 10px rgba(212,178,106,0); } 100% { box-shadow: 0 0 0 0 rgba(212,178,106,0); } }
      @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .sheet-anim { animation: slideUp 0.28s ease; }
      .fade-anim { animation: fadeIn 0.2s ease; }
      button { font-family: inherit; }
      input, select, textarea { font-family: inherit; }
    `}</style>
  );
}

/* ============================================================
   TOP BAR + NAV
   ============================================================ */
function TopBar({ today }) {

    <div style={{ padding: "22px 16px 14px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <div>
        <div className="f-display" style={{ fontSize: 22, fontWeight: 700, letterSpacing: 0.5 }}>SHIFT</div>

      </div>
      <div style={{
        display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 999,
        background: info.dim, border: `1px solid ${info.color}33`,
      }}>
        <span style={{ fontSize: 14 }}>{info.emoji}</span>

function BottomNav({ tab, setTab }) {
  const items = [
    { id: "rhythm", label: "Ритм", Icon: Zap },
    { id: "calendar", label: "Календарь", Icon: CalendarDays },
    { id: "planner", label: "Планировщик", Icon: Sparkles },

        const active = tab === id;
        return (
          <button key={id} onClick={() => setTab(id)} style={{
            flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
            background: "none", border: "none", cursor: "pointer", padding: "6px 0",

}

function Toast({ text }) {
  return (
    <div className="fade-anim" style={{
      position: "fixed", bottom: 100, left: "50%", transform: "translateX(-50%)", zIndex: 60,
      background: C.surface3, border: `1px solid ${C.line}`, color: C.text, padding: "10px 18px",
      borderRadius: 999, fontSize: 13, display: "flex", alignItems: "center", gap: 8,
      boxShadow: "0 8px 20px rgba(0,0,0,0.4)",
    }}>
      <Check size={15} color={C.recovery} /> {text}
    </div>

}

/* ============================================================
   SECTION LABEL
   ============================================================ */
function Eyebrow({ children }) {
  return (
    <div className="f-mono" style={{ fontSize: 11, letterSpacing: 1.6, color: C.textFaint, textTransform: "uppercase", marginBottom: 8 }}>
      {children}
    </div>
  );
}
function Card({ children, style }) {
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 18, padding: 16, ...style }}>
      {children}
    </div>
  );
}

/* ============================================================
   RHYTHM SCREEN — "Мой ритм"
   ============================================================ */
function RhythmScreen({ ctx, prefNudge, setPrefNudge }) {
  const { today, eventsOn } = ctx;
  const idx = cycleIndex(today);
  const [range, setRange] = useState(30);

  const stats = useMemo(() => {
    const c = { day: 0, night: 0, recovery: 0, off: 0 };
    CYCLE.forEach((t) => c[t]++);
    return c;
  }, []);

  const nextRest = useMemo(() => {
    // days until next full-off stretch of >=2 days
    for (let i = 0; i < 40; i++) {
      const d = addDays(today, i);
      if (dayType(d) === "off" && dayType(addDays(d, 1)) === "off") return i;
    }
    return null;
  }, [today]);

  const forecast = useMemo(() => {
    const out = [];
    for (let i = 0; i < range; i++) out.push(addDays(today, i));
    return out;
  }, [today, range]);

  const groupedByMonth = useMemo(() => {
    const groups = {};
    forecast.forEach((d) => {
      const key = d.toLocaleDateString("ru-RU", { month: "long", year: d.getFullYear() !== today.getFullYear() ? "numeric" : undefined });
      groups[key] = groups[key] || [];
      groups[key].push(d);
    });
    return groups;
  }, [forecast]);

  return (
    <div style={{ paddingTop: 6, paddingBottom: 20 }}>
      <Eyebrow>Мой ритм</Eyebrow>
      <div className="f-display" style={{ fontSize: 19, fontWeight: 600, marginBottom: 4 }}>
        2 дня → выходной → 2 ночи → отсыпной → 2 выходных
      </div>
      <div style={{ fontSize: 12.5, color: C.textMute, marginBottom: 18 }}>8-дневный цикл, повторяется без остановки</div>

      <RhythmBracelet centerIndex={idx} />

      <Card style={{ marginTop: 18 }}>
        <Eyebrow>Сейчас ты здесь</Eyebrow>
        <NowStrip idx={idx} />
        <div style={{ marginTop: 14, fontSize: 14, lineHeight: 1.5, color: C.text }}>
          {narrateNow(idx)}
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginTop: 16 }}>
        <StatPill emoji="☀️" n={stats.day} label="дневные" color={C.day} />
        <StatPill emoji="🌙" n={stats.night} label="ночные" color={C.night} />
        <StatPill emoji="🛌" n={stats.recovery} label="отсыпной" color={C.recovery} />
        <StatPill emoji="○" n={stats.off} label="выходных" color={C.off} />
      </div>

      {nextRest !== null && (
        <Card style={{ marginTop: 16, display: "flex", alignItems: "center", gap: 12, borderColor: C.gold + "40" }}>
          <Sparkles size={18} color={C.gold} />
          <div style={{ fontSize: 13, color: C.text, lineHeight: 1.4 }}>
            {nextRest === 0
              ? "Сегодня начинается полноценный отдых."
              : <>Через <b className="f-mono">{nextRest}</b> {ruDays(nextRest)} у тебя начнётся серия полных выходных.</>}
          </div>
        </Card>
      )}

      <div style={{ marginTop: 24, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <Eyebrow>Прогноз ритма</Eyebrow>
        <div style={{ display: "flex", gap: 6 }}>
          {[30, 60, 90].map((r) => (
            <button key={r} onClick={() => setRange(r)} style={{
              padding: "5px 11px", borderRadius: 999, fontSize: 11.5, fontWeight: 600, cursor: "pointer",
              background: range === r ? C.gold : "transparent", color: range === r ? "#1A1607" : C.textMute,
              border: `1px solid ${range === r ? C.gold : C.line}`,
            }}>{r}</button>
          ))}
        </div>
      </div>

      {Object.entries(groupedByMonth).map(([month, days]) => (
        <div key={month} style={{ marginTop: 14 }}>
          <div style={{ fontSize: 12, color: C.textFaint, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>{month}</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {days.map((d) => {
              const meta = TYPE_META[dayType(d)];
              const isToday = toKey(d) === toKey(today);
              return (
                <div key={toKey(d)} title={fmtDay(d)} style={{
                  width: 40, height: 48, borderRadius: 10, background: isToday ? meta.color : meta.dim,
                  border: isToday ? `1px solid ${meta.color}` : `1px solid transparent`,
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2,
                }}>
                  <span style={{ fontSize: 12 }}>{meta.emoji}</span>
                  <span className="f-mono" style={{ fontSize: 9.5, color: isToday ? "#14181D" : C.textFaint, fontWeight: isToday ? 700 : 400 }}>
                    {d.getDate()}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {prefNudge && <PrefNudgeCard onDismiss={() => setPrefNudge(false)} />}
    </div>
  );
}

function ruDays(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n100 >= 11 && n100 <= 14) return "дней";
  if (n10 === 1) return "день";
  if (n10 >= 2 && n10 <= 4) return "дня";
  return "дней";
}

function narrateNow(idx) {
  const type = CYCLE[idx];
  if (type === "night" && idx === 4) return "Сегодня — вторая ночная смена. После неё тебя ждёт отсыпной и 2 полноценных выходных.";
  if (type === "night") return "Сегодня — ночная смена. Впереди ещё одна ночь перед отдыхом.";
  if (type === "recovery") return "Сегодня отсыпной после ночных смен. Не лучший день для активных дел — организму нужно восстановиться.";
  if (type === "day") return "Сегодня дневная смена. Свободного времени немного — утро и поздний вечер.";
  return "Сегодня полноценный выходной — используй его по максимуму.";
}

function InsightsBlock({ ctx }) {
  const { today, eventsOn } = ctx;
  const insights = useMemo(() => buildInsights(today, eventsOn), [today]);
  return (
    <div style={{ marginTop: 22 }}>
      <Eyebrow>Наблюдения</Eyebrow>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

          <Card key={i} style={{ display: "flex", gap: 10, padding: 12 }}>

          </Card>
        ))}
      </div>

function buildInsights(today, eventsOn) {
  const out = [];
  const next14 = Array.from({ length: 14 }, (_, i) => addDays(today, i));
  const freeCount = next14.filter((d) => dayType(d) === "off").length;
  out.push(freeCount <= 2
    ? "На этой неделе у тебя мало свободного времени — старайся не перегружать вечера после смен."
    : "На ближайшие две недели у тебя достаточно свободных дней для новых планов.");

  let restStreak = 0, restStart = null;
  for (let i = 0; i < 30; i++) {
    const d = addDays(today, i);
    if (dayType(d) === "off") {
      if (restStreak === 0) restStart = i;
      restStreak++;
      if (dayType(addDays(d, 1)) !== "off") break;
    } else if (restStreak > 0) break;
  }
  if (restStreak >= 2) {
    out.push(restStart === 0
      ? `Прямо сейчас у тебя ${restStreak} ${ruDays(restStreak)} подряд — хорошее окно для отдыха.`
      : `Через ${restStart} ${ruDays(restStart)} у тебя будет ${restStreak} свободных дня подряд.`);
  }

  const hasNightSoon = Array.from({ length: 5 }, (_, i) => dayType(addDays(today, i))).includes("night");
  out.push(hasNightSoon
    ? "Скоро ночные смены — сейчас не лучший момент планировать длинную поездку."
    : "Ближайшие дни свободны от ночных смен — хорошее время для активных планов.");

  return out.slice(0, 4);
}

/* ============================================================
   SCENARIO SHEET — smart search flows
   ============================================================ */
function ScenarioSheet({ id, ctx, onClose }) {
  const { today, checkConflict, addMany, commitEvent } = ctx;
  const [len, setLen] = useState(id === "workout" ? 60 : id === "tasks" ? 60 : 3);
  const [freq, setFreq] = useState(3);
  const [dayPref, setDayPref] = useState("weekend");
  const [timePref, setTimePref] = useState("any");
  const [results, setResults] = useState(null);
  const [selected, setSelected] = useState([]);

  const titleMap = {
    rest: "Хочу отдохнуть", trip: "Хочу куда-нибудь съездить", workout: "Найти время для тренировки",
    tasks: "Найти время для дел", vacation: "Спланировать отпуск", goal: "Новая цель",
  };

  function runSearch() {
    if (id === "rest" || id === "trip" || id === "vacation") {
      const search = id === "rest" ? 45 : id === "trip" ? 90 : 120;
      const strict = id !== "rest";
      const opts = findStretchWindows(len, search, strict, today, ctx.eventsOn);
      setResults({ kind: "stretch", opts });
      setSelected([]);
    } else if (id === "workout") {
      const slots = findWorkoutSlots(freq, len, dayPref, timePref, today, ctx.eventsOn, checkConflict);
      setResults({ kind: "slots", slots });
      setSelected(slots.map((_, i) => i));
    } else if (id === "tasks") {
      const slots = findTaskSlots(len, 7, today, ctx.eventsOn, checkConflict);
      setResults({ kind: "slots", slots });
      setSelected(slots[0] ? [0] : []);
    }
  }

  function addStretch(opt, evType) {
    const meta = EVENT_META[evType];
    commitEvent({
      type: evType, title: evType === "vacation" ? "Отпуск" : "Поездка",
      date: toKey(opt.start), endDate: toKey(opt.end), duration: 0, priority: "important", category: "Отдых",
    }, { force: true });
    onClose();
  }

  function addWorkoutSlots() {
    const slots = results.slots.filter((_, i) => selected.includes(i));
    addMany(slots.map((s) => ({
      type: "workout", title: "Тренировка", date: toKey(s.date), time: s.time, duration: len,
      priority: "обычное", category: "Спорт",
    })));
    onClose();
  }

  return (
    <Sheet onClose={onClose} title={titleMap[id]}>
      {!results && (
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          {(id === "rest" || id === "trip" || id === "vacation") && (
            <OptionRow label="Продолжительность">
              {(id === "vacation" ? [7, 10, 14] : id === "trip" ? [2, 3, 4, 5, 7] : [1, 2, 3, 4, 5]).map((v) => (
                <Chip key={v} active={len === v} onClick={() => setLen(v)}>{v} {ruDays(v)}</Chip>
              ))}
            </OptionRow>
          )}
          {id === "workout" && (
            <>
              <OptionRow label="Частота в неделю">
                {[1, 2, 3, 4, 5].map((v) => <Chip key={v} active={freq === v} onClick={() => setFreq(v)}>{v}×</Chip>)}
              </OptionRow>
              <OptionRow label="Продолжительность">
                {[30, 45, 60, 90].map((v) => <Chip key={v} active={len === v} onClick={() => setLen(v)}>{v < 60 ? `${v} мин` : `${v / 60} ч${v > 60 ? " " + (v - 60) + " мин" : ""}`}</Chip>)}
              </OptionRow>
              <OptionRow label="Предпочтение">
                {[["weekend", "Только выходные"], ["weekend_free", "Выходные + окна"], ["any", "Любой день"]].map(([v, l]) => (
                  <Chip key={v} active={dayPref === v} onClick={() => setDayPref(v)}>{l}</Chip>
                ))}
              </OptionRow>
              <OptionRow label="Время суток">
                {[["morning", "Утро"], ["day", "День"], ["evening", "Вечер"], ["any", "Любое"]].map(([v, l]) => (
                  <Chip key={v} active={timePref === v} onClick={() => setTimePref(v)}>{l}</Chip>
                ))}
              </OptionRow>
            </>
          )}
          {id === "tasks" && (
            <OptionRow label="Сколько нужно времени">
              {[30, 60, 120, 180].map((v) => (
                <Chip key={v} active={len === v} onClick={() => setLen(v)}>{v < 60 ? `${v} мин` : `${v / 60} ч`}</Chip>
              ))}
            </OptionRow>
          )}
          {id === "goal" && <GoalCreator ctx={ctx} onDone={onClose} />}
          {id !== "goal" && (
            <button onClick={runSearch} style={{
              marginTop: 6, background: C.gold, color: "#1A1607", border: "none", borderRadius: 14,
              padding: "13px", fontSize: 14, fontWeight: 700, cursor: "pointer", display: "flex",
              alignItems: "center", justifyContent: "center", gap: 8,
            }}>
              <Sparkles size={16} /> Найти варианты
            </button>
          )}
        </div>
      )}

      {results && results.kind === "stretch" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {results.opts.length === 0 && <EmptyNote text="Не нашлось подходящего окна в ближайшее время. Попробуй меньшую продолжительность." />}
          {results.opts.map((opt, i) => (
            <Card key={i} style={{ borderColor: i === 0 ? C.gold + "55" : C.line }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  {i === 0 && <div style={{ fontSize: 11, color: C.gold, fontWeight: 700, marginBottom: 4 }}>★ ЛУЧШИЙ ВАРИАНТ</div>}
                  <div className="f-display" style={{ fontSize: 15.5, fontWeight: 700 }}>
                    {fmtDayShort(opt.start)} – {fmtDayShort(opt.end)}
                  </div>
                  <div style={{ fontSize: 11.5, color: C.textFaint, marginTop: 2 }}>{opt.len} {ruDays(opt.len)}</div>
                </div>
                <ScoreBadge score={opt.score} />
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 10 }}>
                {opt.reasons.map((r, ri) => (
                  <div key={ri} style={{ fontSize: 12, color: C.textMute, display: "flex", gap: 6 }}>
                    <span style={{ color: r.ok ? C.recovery : C.danger }}>{r.ok ? "✓" : "✕"}</span> {r.text}
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 8, fontSize: 11.5, color: C.textFaint }}>
                <span>До поездки: {opt.before} свободных дн.</span>
                <span>·</span>
                <span>После: {opt.after} свободных дн.</span>
              </div>
              <button onClick={() => addStretch(opt, id === "vacation" ? "vacation" : "trip")} style={{
                marginTop: 12, width: "100%", background: i === 0 ? C.gold : C.surface2, color: i === 0 ? "#1A1607" : C.text,
                border: `1px solid ${i === 0 ? C.gold : C.line}`, borderRadius: 10, padding: "9px", fontSize: 12.5, fontWeight: 600, cursor: "pointer",
              }}>Добавить в календарь</button>
            </Card>
          ))}
        </div>
      )}

      {results && results.kind === "slots" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {results.slots.length === 0 && <EmptyNote text="Свободных окон не нашлось под эти параметры. Попробуй смягчить фильтры." />}
          {results.slots.length > 0 && id === "workout" && (
            <div style={{ fontSize: 12.5, color: C.textMute, marginBottom: 2 }}>Нашёл {results.slots.length} подходящих окон</div>
          )}
          {results.slots.map((s, i) => {
            const sel = selected.includes(i);
            return (
              <Card key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderColor: sel ? C.gold + "55" : C.line, cursor: "pointer" }}
                onClick={() => setSelected((cur) => cur.includes(i) ? cur.filter((x) => x !== i) : [...cur, i])}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{
                    width: 20, height: 20, borderRadius: 6, border: `1.5px solid ${sel ? C.gold : C.textFaint}`,
                    background: sel ? C.gold : "transparent", display: "flex", alignItems: "center", justifyContent: "center",
                  }}>{sel && <Check size={13} color="#1A1607" />}</div>
                  <div>
                    <div style={{ fontSize: 13.5, fontWeight: 600 }}>{fmtDay(s.date)}</div>
                    <div className="f-mono" style={{ fontSize: 12, color: C.textFaint }}>{s.time} · {TYPE_META[dayType(s.date)].label.toLowerCase()}</div>
                  </div>
                </div>
                <Star size={14} color={i === 0 ? C.gold : "transparent"} fill={i === 0 ? C.gold : "none"} />
              </Card>
            );
          })}
          {results.slots.length > 0 && (
            <button onClick={id === "workout" ? addWorkoutSlots : () => {
              const s = results.slots[selected[0]];
              commitEvent({ type: "task", title: "Личное дело", date: toKey(s.date), time: s.time, duration: len, priority: "обычное", category: "Личное" }, { force: true });
              onClose();
            }} style={{
              marginTop: 4, background: C.gold, color: "#1A1607", border: "none", borderRadius: 14,
              padding: "13px", fontSize: 14, fontWeight: 700, cursor: "pointer",
            }}>
              {id === "workout" ? `Добавить все (${selected.length})` : "Добавить выбранное"}
            </button>
          )}
        </div>
      )}
    </Sheet>
  );
}

function ScoreBadge({ score }) {

/* ============================================================
   SMART SEARCH ALGORITHMS (SmartPlannerEngine)
   ============================================================ */
function findStretchWindows(len, searchDays, strict, today, eventsOn) {
  const candidates = [];
  for (let i = 0; i < searchDays - len + 1; i++) {
    const start = addDays(today, i);
    let workDays = 0, recoveryDays = 0, offDays = 0;
    for (let k = 0; k < len; k++) {
      const t = dayType(addDays(start, k));
      if (t === "day" || t === "night") workDays++;
      else if (t === "recovery") recoveryDays++;
      else offDays++;
    }
    const startType = dayType(start);
    if (strict && startType === "recovery") continue;
    let score = 100 - workDays * (strict ? 40 : 30) - recoveryDays * (strict ? 15 : 6);
    const before = dayType(addDays(start, -1)) === "off" ? 1 : 0;
    const end = addDays(start, len - 1);
    const after = dayType(addDays(end, 1)) === "off" ? 1 : 0;
    score += (before + after) * 2;
    score = Math.max(4, Math.min(100, Math.round(score)));
    if (strict && workDays > Math.ceil(len * 0.4)) continue;
    candidates.push({
      start, end, len, score, before: countFreeBefore(start), after: countFreeAfter(end),
      reasons: [
        { ok: workDays === 0, text: workDays === 0 ? "нет рабочих смен" : `${workDays} рабоч. ${ruDays(workDays)} внутри окна` },
        { ok: recoveryDays === 0, text: recoveryDays === 0 ? "не попадает на отсыпной" : "частично попадает на отсыпной" },
        { ok: before + after > 0, text: before + after > 0 ? "хорошие свободные дни рядом" : "плотный график по краям" },
      ],
    });
  }
  candidates.sort((a, b) => b.score - a.score || a.start - b.start);
  const out = [];
  for (const c of candidates) {
    if (out.some((o) => Math.abs(o.start - c.start) < len)) continue;
    out.push(c);
    if (out.length >= 3) break;
  }
  return out;

  function countFreeBefore(d) {
    let n = 0;
    for (let i = 1; i <= 5; i++) { if (dayType(addDays(d, -i)) === "off") n++; else break; }
    return n;
  }
  function countFreeAfter(d) {
    let n = 0;
    for (let i = 1; i <= 5; i++) { if (dayType(addDays(d, i)) === "off") n++; else break; }
    return n;
  }
}

const TIME_RANGES = { morning: [360, 720], day: [720, 1080], evening: [1080, 1380] };

function findWorkoutSlots(freq, duration, dayPref, timePref, today, eventsOn, checkConflict) {
  const allowedTypes = dayPref === "weekend" ? ["off"] : dayPref === "weekend_free" ? ["off", "recovery"] : ["off", "recovery", "day", "night"];
  const out = [];
  const usedDays = new Set();
  const weeks = 3;
  for (let i = 1; i < weeks * 7 && out.length < freq * weeks; i++) {
    const d = addDays(today, i);
    const key = toKey(d);
    if (usedDays.has(key)) continue;
    const type = dayType(d);
    if (!allowedTypes.includes(type)) continue;
    const base = BASE_FREE[type];
    let placed = false;
    for (const [ws, we] of base) {
      const s = t2m(ws), e = t2m(we);
      let candStart = s;
      if (timePref !== "any" && TIME_RANGES[timePref]) {
        const [ps, pe] = TIME_RANGES[timePref];
        candStart = Math.max(s, ps);
        if (candStart + duration > Math.min(e, pe)) continue;
      } else if (candStart + duration > e) continue;
      const timeStr = m2t(candStart);
      if (checkConflict(key, timeStr, duration)) continue;
      out.push({ date: d, time: timeStr });
      usedDays.add(key);
      placed = true;
      break;
    }
    if (!placed) continue;
  }
  return out.slice(0, Math.max(freq * 2, 3));
}

function findTaskSlots(duration, withinDays, today, eventsOn, checkConflict) {
  const out = [];
  for (let i = 0; i < withinDays && out.length < 5; i++) {
    const d = addDays(today, i);
    const key = toKey(d);
    const type = dayType(d);
    for (const [ws, we] of BASE_FREE[type]) {
      const s = t2m(ws), e = t2m(we);
      if (e - s < duration) continue;
      const timeStr = m2t(s);
      if (checkConflict(key, timeStr, duration)) continue;
      out.push({ date: d, time: timeStr });
      break;
    }
  }
  return out;
}

/* ============================================================
   SEED DATA
   ============================================================ */
function seedEvents(today) {
  // Land the demo events on the next full day off, wherever that falls in the cycle.
  let d = today;
  for (let i = 0; i < 10; i++) {
    if (dayType(d) === "off") break;
    d = addDays(d, 1);
  }
  const key = toKey(d);
  return [
    { id: "s1", type: "task", title: "Купить продукты", date: key, time: "17:00", duration: 30, category: "Дом" },
    { id: "s2", type: "workout", title: "Зал", date: key, time: "12:00", duration: 90, category: "Спорт" },
    { id: "s3", type: "event", title: "Игровой вечер", date: key, time: "19:00", duration: 120, category: "Личное" },
  ];
}
