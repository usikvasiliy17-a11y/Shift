<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useMemo, useRef, useEffect } from "react";
import ReactDOM from "react-dom/client";
import {
  Sun, Moon, BedDouble, Circle, Plus, Dumbbell, Car, Palmtree, CalendarDays,
  Target, ChevronLeft, ChevronRight, X, Check, AlertTriangle, Sparkles,
  ClipboardList, ArrowRight, Star, Clock, Info, Filter, Users, Gamepad2,
  ChevronDown, TrendingUp, Zap, Trash2, Share2, Copy, Menu, StickyNote,
  Settings, LayoutGrid, Download, Upload, RotateCcw, Repeat, Pencil
} from "lucide-react";

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
const C = {
  bg: "#0F1419",
  bg2: "#0B0F14",
  surface: "#171D26",
  surface2: "#1F2733",
  surface3: "#252F3D",
  line: "#2A3441",
  text: "#E8ECF1",
  textMute: "#8B95A5",
  textFaint: "#5B6472",
  day: "#E8A94C",
  dayDim: "#4A3D28",
  night: "#7C8FE0",
  nightDim: "#2B2F4A",
  recovery: "#7FA88F",
  recoveryDim: "#2A3830",
  off: "#6B7688",
  offDim: "#242B35",
  danger: "#D9776B",
  dangerDim: "#3A2622",
  gold: "#D4B26A",
};

const ACCENT_PRESETS = [
  { name: "Золотой", value: "#D4B26A" },
  { name: "Изумрудный", value: "#7FB88A" },
  { name: "Розовый", value: "#D98CA0" },
  { name: "Синий", value: "#6FA8D9" },
  { name: "Сиреневый", value: "#A88CD9" },
];

const TYPE_META = {
  day: { emoji: "☀️", label: "Дневная", short: "День", color: C.day, dim: C.dayDim, Icon: Sun },
  night: { emoji: "🌙", label: "Ночная", short: "Ночь", color: C.night, dim: C.nightDim, Icon: Moon },
  recovery: { emoji: "🛌", label: "Отсыпной", short: "Отс", color: C.recovery, dim: C.recoveryDim, Icon: BedDouble },
  off: { emoji: "○", label: "Выходной", short: "Вых", color: C.off, dim: C.offDim, Icon: Circle },
};

const EVENT_META = {
  task: { emoji: "📝", label: "Задача", Icon: ClipboardList, color: "#9AA5B8" },
  workout: { emoji: "🏋️", label: "Тренировка", Icon: Dumbbell, color: "#E0955C" },
  trip: { emoji: "🚗", label: "Поездка", Icon: Car, color: "#6FB0C4" },
  vacation: { emoji: "🏖", label: "Отпуск", Icon: Palmtree, color: "#7FA88F" },
  event: { emoji: "📅", label: "Событие", Icon: CalendarDays, color: "#B79AE0" },
  goal: { emoji: "🎯", label: "Цель", Icon: Target, color: C.gold },
  note: { emoji: "📌", label: "Заметка", Icon: StickyNote, color: "#D9C08A" },
};

const CATEGORY_COLORS = {
  "Дом": "#6FB0C4",
  "Работа": "#D98CA0",
  "Личное": "#A88CD9",
  "Здоровье": "#7FB88A",
  "Заметка": "#D9C08A",
};

const DEFAULT_CYCLE = ["day", "day", "off", "night", "night", "recovery", "off", "off"];
const DEFAULT_ANCHOR_KEY = "2026-08-05"; // 5 Aug 2026 == cycle index 0

// Mutable "current shift pattern" — kept in sync with React state (shiftConfig)
// at the top of AppShell's render, every render. Every date-engine helper below
// reads these two, so changing them makes the whole app follow a custom pattern
// without threading config through every function call.
let CYCLE = [...DEFAULT_CYCLE];
let ANCHOR = new Date(2026, 7, 5);

/* ============================================================
   DATE / ENGINE HELPERS
   ============================================================ */
const MS_DAY = 86400000;
function toKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function keyToDate(k) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function findCover(key, events) {
  return events.find(
    (e) => (e.type === "vacation" || e.type === "trip") && e.endDate && key >= e.date && key <= e.endDate
  );
}
function mondayIndex(d) {
  return (d.getDay() + 6) % 7; // Monday=0 ... Sunday=6
}

const PLURAL_FORMS = {
  day: ["день", "дня", "дней"],
  night: ["ночь", "ночи", "ночей"],
  recovery: ["отсыпной", "отсыпных", "отсыпных"],
  off: ["выходной", "выходных", "выходных"],
};
function pluralType(type, n) {
  const f = PLURAL_FORMS[type];
  if (n === 1) return f[0];
  const n10 = n % 10, n100 = n % 100;
  const idx = n100 >= 11 && n100 <= 14 ? 2 : n10 === 1 ? 0 : n10 >= 2 && n10 <= 4 ? 1 : 2;
  return `${n} ${f[idx]}`;
}
function describeCycle(cycle) {
  if (!cycle || cycle.length === 0) return "";
  const groups = [];
  let i = 0;
  while (i < cycle.length) {
    let j = i;
    while (j < cycle.length && cycle[j] === cycle[i]) j++;
    groups.push(pluralType(cycle[i], j - i));
    i = j;
  }
  return groups.join(" · ");
}
function groupCycleRuns(cycle) {
  if (!cycle || cycle.length === 0) return [];
  const labelFor = { day: "РАБОТА", night: "РАБОТА", recovery: "ВОССТАНОВЛЕНИЕ", off: "ОТДЫХ" };
  const groups = [];
  let i = 0;
  while (i < cycle.length) {
    let j = i;
    while (j < cycle.length && cycle[j] === cycle[i]) j++;
    const count = j - i;
    groups.push({
      label: labelFor[cycle[i]],
      emoji: Array.from({ length: count }, () => TYPE_META[cycle[i]].emoji).join(" "),
    });
    i = j;
  }
  return groups;
}
function buildMonthScheduleText(monthDate, events) {
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const monthLabel = first.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
  const lines = [`График SHIFT — ${monthLabel}`, ""];
  for (let d = first; d <= last; d = addDays(d, 1)) {
    const key = toKey(d);
    const cover = findCover(key, events);
    const weekday = fmtWeekday(d);
    const dateNum = String(d.getDate()).padStart(2, "0");
    if (cover) {
      const em = EVENT_META[cover.type];
      lines.push(`${dateNum} (${weekday}) — ${em.emoji} ${em.label}: ${cover.title}`);
    } else {
      const type = dayType(d);
      const meta = TYPE_META[type];
      if (type === "day" || type === "night") {
        const [ws, we] = WORK_HOURS[type];
        lines.push(`${dateNum} (${weekday}) — ${meta.emoji} ${meta.label} ${ws} → ${we}`);
      } else {
        lines.push(`${dateNum} (${weekday}) — ${meta.emoji} ${meta.label}`);
      }
    }
  }
  lines.push("", "Отправлено из приложения SHIFT");
  return lines.join("\n");
}

async function renderMonthImageBlob(monthDate, events, realToday) {
  try { await document.fonts.ready; } catch (e) {}

  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const startOffset = mondayIndex(first);
  const numRows = Math.ceil((last.getDate() + startOffset) / 7);

  const W = 900, padX = 44, gap = 6;
  const cellW = (W - padX * 2) / 7;
  const cellH = 96;
  const headerH = 150;
  const weekHeaderH = 34;
  const legendH = 74;
  const H = headerH + weekHeaderH + numRows * cellH + legendH;
  const scale = 2;

  const canvas = document.createElement("canvas");
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // background
  ctx.fillStyle = "#0F1419";
  ctx.fillRect(0, 0, W, H);
  const grad = ctx.createLinearGradient(0, 0, 0, headerH);
  grad.addColorStop(0, "#1F273388");
  grad.addColorStop(1, "#0F141900");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, headerH);

  // header
  ctx.textAlign = "left";
  ctx.fillStyle = C.gold;
  ctx.font = "700 20px 'Space Grotesk'";
  ctx.fillText("SHIFT", padX, 52);

  const monthLabelRaw = first.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
  const monthLabel = monthLabelRaw.charAt(0).toUpperCase() + monthLabelRaw.slice(1);
  ctx.fillStyle = "#E8ECF1";
  ctx.font = "700 38px 'Space Grotesk'";
  ctx.fillText(monthLabel, padX, 98);

  let shiftsCount = 0, offCount = 0;
  for (let d = first; d <= last; d = addDays(d, 1)) {
    const t = dayType(d);
    if (t === "day" || t === "night") shiftsCount++;
    if (t === "off") offCount++;
  }
  ctx.fillStyle = "#8B95A5";
  ctx.font = "500 14px 'Inter'";
  ctx.fillText(`${shiftsCount} смен · ${offCount} выходных`, padX, 126);

  // weekday row
  const weekdays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  ctx.font = "600 11px 'IBM Plex Mono'";
  ctx.fillStyle = "#5B6472";
  ctx.textAlign = "center";
  weekdays.forEach((w, i) => ctx.fillText(w, padX + i * cellW + cellW / 2, headerH + 22));

  const gridTop = headerH + weekHeaderH;
  const todayKey = toKey(realToday);
  const TYPE_COLORS = { day: C.day, night: C.night, recovery: C.recovery, off: C.off };
  const TYPE_DIM = { day: C.dayDim, night: C.nightDim, recovery: C.recoveryDim, off: C.offDim };
  const TYPE_EMOJI = { day: "☀️", night: "🌙", recovery: "🛌", off: "○" };

  for (let d = first; d <= last; d = addDays(d, 1)) {
    const idx = startOffset + (d.getDate() - 1);
    const row = Math.floor(idx / 7), col = idx % 7;
    const x = padX + col * cellW + gap / 2;
    const y = gridTop + row * cellH + gap / 2;
    const w = cellW - gap, h = cellH - gap;

    const key = toKey(d);
    const cover = findCover(key, events);
    const isToday = key === todayKey;
    const type = dayType(d);

    let bg, emoji, sub;
    if (cover) {
      emoji = EVENT_META[cover.type].emoji;
      bg = cover.type === "vacation" ? "#24352C" : "#1D2E35";
      sub = cover.type === "vacation" ? "отпуск" : "поездка";
    } else {
      emoji = TYPE_EMOJI[type];
      bg = isToday ? TYPE_COLORS[type] : TYPE_DIM[type];
      sub = type === "day" ? "09–21" : type === "night" ? "21→09" : type === "recovery" ? "отсыпной" : "";
    }

    roundRect(x, y, w, h, 10);
    ctx.fillStyle = bg;
    ctx.fill();
    if (isToday) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = cover ? (cover.type === "vacation" ? C.recovery : "#6FB0C4") : TYPE_COLORS[type];
      ctx.stroke();
    }

    const onColor = isToday && !cover ? "#14181D" : "#E8ECF1";
    ctx.textAlign = "left";
    ctx.fillStyle = onColor;
    ctx.font = "700 15px 'IBM Plex Mono'";
    ctx.fillText(String(d.getDate()), x + 9, y + 22);

    ctx.textAlign = "right";
    ctx.font = "20px sans-serif";
    ctx.fillText(emoji, x + w - 9, y + 26);

    ctx.textAlign = "left";
    ctx.font = "500 10px 'IBM Plex Mono'";
    ctx.fillStyle = isToday && !cover ? "#14181Db3" : "#8B95A5";
    if (sub) ctx.fillText(sub, x + 9, y + h - 11);
  }

  // legend
  const legendY = gridTop + numRows * cellH + 32;
  const legendItems = [["☀️", "День", C.day], ["🌙", "Ночь", C.night], ["🛌", "Отсыпной", C.recovery], ["○", "Выходной", C.off]];
  let lx = padX;
  legendItems.forEach(([emoji, label, color]) => {
    ctx.textAlign = "left";
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(lx + 5, legendY - 4, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = "500 12px 'Inter'";
    ctx.fillStyle = "#8B95A5";
    ctx.fillText(label, lx + 16, legendY);
    lx += 16 + ctx.measureText(label).width + 22;
  });

  ctx.textAlign = "right";
  ctx.font = "400 11px 'Inter'";
  ctx.fillStyle = "#5B6472";
  ctx.fillText("Создано в SHIFT", W - padX, H - 22);

  return new Promise((resolve) => canvas.toBlob((blob) => resolve(blob), "image/png"));
}

function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}
function fmtDay(d) {
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}
function fmtDayShort(d) {
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
}
function fmtWeekday(d) {
  const s = d.toLocaleDateString("ru-RU", { weekday: "short" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function cycleIndex(d) {
  const diff = Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - ANCHOR) / MS_DAY);
  const n = CYCLE.length || 1;
  return ((diff % n) + n) % n;
}
function dayType(d) {
  return CYCLE[cycleIndex(d)];
}
function t2m(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function m2t(m) {
  m = ((m % 1440) + 1440) % 1440;
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}

const BASE_FREE = {
  day: [["06:00", "08:45"], ["21:15", "23:30"]],
  night: [["11:00", "17:30"]],
  recovery: [["15:00", "23:00"]],
  off: [["08:00", "23:30"]],
};
const WORK_HOURS = {
  day: ["09:00", "21:00"],
  night: ["21:00", "09:00"],
};

function subtractInterval(windows, busyStart, busyEnd) {
  const out = [];
  for (const [s, e] of windows) {
    if (busyEnd <= s || busyStart >= e) { out.push([s, e]); continue; }
    if (busyStart > s) out.push([s, busyStart]);
    if (busyEnd < e) out.push([busyEnd, e]);
  }
  return out.filter(([s, e]) => e - s >= 10);
}

/* ============================================================
   TAP FEEDBACK — tiny synthesized sounds + vibration.
   Both are wrapped in try/catch and feature-checked, so this is a
   no-op (never throws) on browsers/devices that don't support them
   — notably: iOS Safari has no Vibration API at all (Apple platform
   restriction, not a bug here), so haptics silently do nothing there
   while sound still plays.
   ============================================================ */
let FEEDBACK_ENABLED = true;
let sharedAudioCtx = null;
function playTone(freq, duration, volume) {
  if (!FEEDBACK_ENABLED) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!sharedAudioCtx) sharedAudioCtx = new Ctx();
    if (sharedAudioCtx.state === "suspended") sharedAudioCtx.resume();
    const osc = sharedAudioCtx.createOscillator();
    const gain = sharedAudioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain);
    gain.connect(sharedAudioCtx.destination);
    const t0 = sharedAudioCtx.currentTime;
    osc.start(t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.stop(t0 + duration + 0.02);
  } catch (e) {}
}
function vibrate(pattern) {
  if (!FEEDBACK_ENABLED) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}
function feedback(kind) {
  switch (kind) {
    case "success": playTone(880, 0.09, 0.05); vibrate(12); break;
    case "delete": playTone(340, 0.1, 0.045); vibrate([10, 30, 10]); break;
    case "warning": playTone(220, 0.16, 0.05); vibrate([20, 40, 20]); break;
    case "tap": vibrate(8); break;
    default: break;
  }
}

/* ============================================================
   ROOT APP
   ============================================================ */
function AppShell() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(id);
  }, []);
  const today = useMemo(() => new Date(now.getFullYear(), now.getMonth(), now.getDate()), [now.toDateString()]);

  const [events, setEvents] = useState(() => {
    try {
      const saved = localStorage.getItem("shift.events");
      return saved ? JSON.parse(saved) : seedEvents(today);
    } catch {
      return seedEvents();
    }
  });

  useEffect(() => {
    try { localStorage.setItem("shift.events", JSON.stringify(events)); } catch {}
  }, [events]);

  const [shiftConfig, setShiftConfig] = useState(() => {
    try {
      const saved = localStorage.getItem("shift.config");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed.cycle) && parsed.cycle.length > 0 && parsed.anchorKey) return parsed;
      }
    } catch {}
    return { cycle: [...DEFAULT_CYCLE], anchorKey: DEFAULT_ANCHOR_KEY };
  });
  // Keep the mutable engine config in sync BEFORE any child renders this pass.
  CYCLE = shiftConfig.cycle;
  ANCHOR = keyToDate(shiftConfig.anchorKey);

  useEffect(() => {
    try { localStorage.setItem("shift.config", JSON.stringify(shiftConfig)); } catch {}
  }, [shiftConfig]);

  const [accentColor, setAccentColor] = useState(() => {
    try { return localStorage.getItem("shift.accent") || ACCENT_PRESETS[0].value; } catch { return ACCENT_PRESETS[0].value; }
  });
  C.gold = accentColor;
  useEffect(() => {
    try { localStorage.setItem("shift.accent", accentColor); } catch {}
  }, [accentColor]);

  const [soundEnabled, setSoundEnabled] = useState(() => {
    try {
      const saved = localStorage.getItem("shift.feedback");
      return saved === null ? true : saved === "1";
    } catch { return true; }
  });
  FEEDBACK_ENABLED = soundEnabled;
  useEffect(() => {
    try { localStorage.setItem("shift.feedback", soundEnabled ? "1" : "0"); } catch {}
  }, [soundEnabled]);

  const [tab, setTab] = useState("rhythm");
  const [navOpen, setNavOpen] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [editingEvent, setEditingEvent] = useState(null);
  const [scenario, setScenario] = useState(null); // active quick-scenario id
  const [conflict, setConflict] = useState(null); // pending conflict payload
  const [toast, setToast] = useState(null); // string, or { text, action: { label, onClick } }
  const [prefNudge, setPrefNudge] = useState(true);

  useEffect(() => {
    if (!toast) return;
    const hasAction = typeof toast === "object" && toast.action;
    const id = setTimeout(() => setToast(null), hasAction ? 4200 : 2600);
    return () => clearTimeout(id);
  }, [toast]);

  function eventsOn(key) {
    return events.filter((e) => e.date === key || (e.endDate && key >= e.date && key <= e.endDate));
  }

  function getFreeWindows(key) {
    const d = keyToDate(key);
    const type = findCover(key, events) ? "off" : dayType(d);
    let windows = BASE_FREE[type].map(([s, e]) => [t2m(s), t2m(e)]);
    for (const ev of eventsOn(key)) {
      if (!ev.time) continue;
      const s = t2m(ev.time);
      const e = s + (ev.duration || 60);
      windows = windows.flatMap((w) => subtractInterval([w], s, e));
    }
    return windows.map(([s, e]) => [m2t(s), m2t(e)]);
  }

  function checkConflict(key, time, duration, excludeId) {
    const d = keyToDate(key);
    const cover = findCover(key, events);
    const type = cover ? "off" : dayType(d);
    const s = t2m(time), e = s + duration;
    if (!cover && (type === "day" || type === "night")) {
      const [ws, we] = WORK_HOURS[type];
      let wStart = t2m(ws), wEnd = t2m(we);
      const overlapsWork = type === "night"
        ? (s < wEnd || e > wStart || wEnd < wStart) && !(e <= wStart && s >= wEnd)
        : s < wEnd && e > wStart;
      if (type === "night") {
        // night shift spans 21:00->09:00 next day; treat as busy outside 11:00-17:30 free window
        const freeS = t2m("11:00"), freeE = t2m("17:30");
        if (!(s >= freeS && e <= freeE)) {
          return { kind: "shift", type, work: `${ws} → ${we}` };
        }
      } else if (overlapsWork) {
        return { kind: "shift", type, work: `${ws}–${we}` };
      }
    }
    if (type === "recovery" && s < t2m("15:00")) {
      return { kind: "recovery" };
    }
    for (const ev of eventsOn(key)) {
      if (!ev.time || ev.id === excludeId) continue;
      const es = t2m(ev.time), ee = es + (ev.duration || 60);
      if (s < ee && e > es) return { kind: "event", other: ev };
    }
    return null;
  }

  function commitEvent(ev, { force, editId } = {}) {
    if (!force && ev.time) {
      const c = checkConflict(ev.date, ev.time, ev.duration || 60, editId);
      if (c) {
        setConflict({ ev, c, editId });
        feedback("warning");
        return false;
      }
    }
    if (editId) {
      setEvents((prev) => prev.map((e) => (e.id === editId ? { ...e, ...ev, id: editId } : e)));
      setToast(`Изменено: ${ev.title}`);
    } else {
      setEvents((prev) => [...prev, { ...ev, id: crypto.randomUUID() }]);
      setToast(`Добавлено: ${ev.title}`);
    }
    feedback("success");
    return true;
  }

  function addMany(evs) {
    setEvents((prev) => [...prev, ...evs.map((e) => ({ ...e, id: crypto.randomUUID() }))]);
    setToast(`Добавлено событий: ${evs.length}`);
    feedback("success");
  }

  function deleteEvent(id) {
    const ev = events.find((e) => e.id === id);
    if (!ev) return;
    setEvents((prev) => prev.filter((e) => e.id !== id));
    setToast({
      text: `Удалено: ${ev.title}`,
      action: { label: "Отменить", onClick: () => setEvents((prev) => [...prev, ev]) },
    });
    feedback("delete");
  }

  function toggleChecklistItem(eventId, itemId) {
    setEvents((prev) => prev.map((e) => {
      if (e.id !== eventId || !e.checklist) return e;
      return { ...e, checklist: e.checklist.map((it) => (it.id === itemId ? { ...it, done: !it.done } : it)) };
    }));
    feedback("tap");
  }

  function updateShiftConfig(next) {
    setShiftConfig(next);
    setToast("График сохранён");
  }

  function exportData() {
    const payload = { app: "SHIFT", version: 1, exportedAt: new Date().toISOString(), events, shiftConfig };
    try {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `shift-backup-${toKey(today)}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setToast("Резервная копия сохранена");
    } catch (e) {
      setToast("Не удалось создать копию");
    }
  }

  function importBackup(data) {
    if (!data || !Array.isArray(data.events)) {
      setToast("Файл повреждён или не подходит");
      return false;
    }
    setEvents(data.events);
    if (data.shiftConfig && Array.isArray(data.shiftConfig.cycle) && data.shiftConfig.anchorKey) {
      setShiftConfig(data.shiftConfig);
    }
    setToast("Данные восстановлены из файла");
    return true;
  }

  const ctx = {
    today, now, events, eventsOn, getFreeWindows, checkConflict, commitEvent, addMany, deleteEvent,
    setToast, shiftConfig, updateShiftConfig, exportData, importBackup,
    editingEvent, setEditingEvent, toggleChecklistItem, soundEnabled, setSoundEnabled,
    accentColor, setAccentColor,
  };

  return (
    <div className="shift-app app-scroll app-viewport" style={{
      background: C.bg, color: C.text, overflowY: "auto",
      WebkitOverflowScrolling: "touch", overscrollBehaviorY: "contain",
    }}>
      <FontStyles />
      <div style={{ maxWidth: 460, margin: "0 auto", position: "relative", minHeight: "100%", paddingBottom: "calc(90px + env(safe-area-inset-bottom))" }}>
        <TopBar today={today} events={events} onMenu={() => setNavOpen(true)} />

        <div key={tab} className="tab-enter" style={{ padding: "0 16px" }}>
          {tab === "rhythm" && <RhythmScreen ctx={ctx} prefNudge={prefNudge} setPrefNudge={setPrefNudge} />}
          {tab === "calendar" && <CalendarScreen ctx={ctx} onAdd={() => setAddOpen(true)} />}
          {tab === "planner" && <PlannerScreen ctx={ctx} scenario={scenario} setScenario={setScenario} />}
          {tab === "month" && <MonthScreen ctx={ctx} />}
          {tab === "year" && <YearScreen ctx={ctx} />}
          {tab === "settings" && <SettingsScreen ctx={ctx} />}
        </div>

        <button
          className="press-fx"
          onClick={() => { feedback("tap"); setAddOpen(true); }}
          aria-label="Добавить событие"
          style={{
            position: "fixed", right: 16, bottom: "calc(20px + env(safe-area-inset-bottom))",
            width: 56, height: 56, borderRadius: 999, background: C.gold, color: "#1A1607",
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: `0 8px 24px ${hexToRgba(C.gold, 0.35)}`, border: "none", cursor: "pointer", zIndex: 40,
          }}
        >
          <Plus size={26} strokeWidth={2.4} />
        </button>

        {navOpen && <NavSheet tab={tab} setTab={(t) => { setTab(t); setNavOpen(false); }} onClose={() => setNavOpen(false)} />}

        {(addOpen || editingEvent) && (
          <AddEventSheet
            ctx={ctx}
            editEvent={editingEvent}
            onClose={() => { setAddOpen(false); setEditingEvent(null); }}
          />
        )}
        {conflict && (
          <ConflictModal
            data={conflict}
            onCancel={() => setConflict(null)}
            onForce={() => { commitEvent(conflict.ev, { force: true, editId: conflict.editId }); setConflict(null); }}
            onReschedule={() => setConflict(null)}
          />
        )}
        {toast && <Toast toast={toast} />}
      </div>
    </div>
  );
}

function App() {
  const isStandalone = useMemo(() => {
    if (typeof window === "undefined") return false;
    return (
      window.matchMedia?.("(display-mode: standalone)")?.matches ||
      window.navigator?.standalone === true
    );
  }, []);

  const [showSplash, setShowSplash] = useState(isStandalone);
  const [splashFading, setSplashFading] = useState(false);

  useEffect(() => {
    if (!showSplash) return;
    const t1 = setTimeout(() => setSplashFading(true), 1000);
    const t2 = setTimeout(() => setShowSplash(false), 1380);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [showSplash]);

  return (
    <>
      <AppShell />
      {showSplash && <LaunchSplash fading={splashFading} />}
    </>
  );
}

// Swipe-left-to-reveal-delete, in the style of native Mail/Notes lists.
// touch-action:"pan-y" tells the browser to keep handling vertical scroll
// natively while we handle horizontal drag ourselves in JS — this is the
// standard way to avoid fighting the page scroll on a touch device.
function SwipeableRow({ children, onDelete, onTap, style, radius = 12, contentStyle }) {
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startX = useRef(0);
  const moved = useRef(false);
  const openRef = useRef(false);
  const REVEAL = 84;

  function onDown(e) {
    startX.current = e.clientX;
    moved.current = false;
    setDragging(true);
    e.currentTarget.setPointerCapture?.(e.pointerId);
  }
  function onMove(e) {
    if (!dragging) return;
    const dx = e.clientX - startX.current + (openRef.current ? -REVEAL : 0);
    if (Math.abs(dx) > 4) moved.current = true;
    if (dx < 0) setDragX(Math.max(dx, -REVEAL));
    else setDragX(0);
  }
  function onUp() {
    if (!dragging) return;
    setDragging(false);
    setDragX((x) => {
      const willOpen = x < -REVEAL / 2;
      openRef.current = willOpen;
      return willOpen ? -REVEAL : 0;
    });
  }
  function handleRowClick() {
    if (moved.current) return;
    if (openRef.current) { setDragX(0); openRef.current = false; return; }
    onTap?.();
  }

  return (
    <div style={{ position: "relative", overflow: "hidden", borderRadius: radius, ...style }}>
      <div style={{
        position: "absolute", inset: 0, display: "flex", justifyContent: "flex-end", alignItems: "stretch",
        background: C.danger,
      }}>
        <button
          onClick={(e) => { e.stopPropagation(); feedback("delete"); onDelete(); setDragX(0); openRef.current = false; }}
          style={{
            width: REVEAL, background: "none", border: "none", color: "#fff", cursor: "pointer",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3,
          }}
        >
          <Trash2 size={16} />
          <span style={{ fontSize: 10, fontWeight: 600 }}>Удалить</span>
        </button>
      </div>
      <div
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
        onClick={handleRowClick}
        style={{
          transform: `translateX(${dragX}px)`, transition: dragging ? "none" : "transform 0.2s ease",
          touchAction: "pan-y", position: "relative", background: C.bg2, WebkitTapHighlightColor: "transparent",
          ...contentStyle,
        }}
      >
        {children}
      </div>
    </div>
  );
}

function RhythmScreen({ ctx, prefNudge, setPrefNudge }) {
  const { today, eventsOn, shiftConfig } = ctx;
  const idx = cycleIndex(today);
  const [range, setRange] = useState(30);
  const [selectedDay, setSelectedDay] = useState(null);

  const stats = useMemo(() => {
    const c = { day: 0, night: 0, recovery: 0, off: 0 };
    CYCLE.forEach((t) => c[t]++);
    return c;
  }, [shiftConfig]);

  const nextRest = useMemo(() => {
    // days until next full-off stretch of >=2 days
    for (let i = 0; i < 40; i++) {
      const d = addDays(today, i);
      if (dayType(d) === "off" && dayType(addDays(d, 1)) === "off") return i;
    }
    return null;
  }, [today, shiftConfig]);

  const forecast = useMemo(() => {
    const out = [];
    for (let i = 0; i < range; i++) out.push(addDays(today, i));
    return out;
  }, [today, range]);

  const groupedByMonth = useMemo(() => {
    const groups = {};
    forecast.forEach((d) => {
      const key = d.toLocaleDateString("ru-RU", { month: "long", year: d.getFullYear() !== today.getFullYear() ? "numeric" : undefined });
      groups[key] = groups[key] || [];
      groups[key].push(d);
    });
    return groups;
  }, [forecast]);

  return (
    <div style={{ paddingTop: 4, paddingBottom: 20 }}>
      <NextUpCard now={ctx.now} events={ctx.events} />

      <RhythmBracelet centerIndex={idx} />

      <div style={{ marginTop: 16, fontSize: 14.5, lineHeight: 1.6, color: C.text, padding: "0 2px" }}>
        {narrateNow(idx)}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginTop: 20 }}>
        <StatPill emoji="☀️" n={stats.day} label="дневные" color={C.day} />
        <StatPill emoji="🌙" n={stats.night} label="ночные" color={C.night} />
        <StatPill emoji="🛌" n={stats.recovery} label="отсыпной" color={C.recovery} />
        <StatPill emoji="○" n={stats.off} label="выходных" color={C.off} />
      </div>

      {nextRest !== null && (
        <Card style={{ marginTop: 16, display: "flex", alignItems: "center", gap: 12, borderColor: C.gold + "40" }}>
          <Sparkles size={18} color={C.gold} />
          <div style={{ fontSize: 13, color: C.text, lineHeight: 1.4 }}>

                  width: "100%", height: 48, borderRadius: 10, background: isToday ? meta.color : meta.dim,
                  border: isToday ? `1px solid ${meta.color}` : `1px solid transparent`,

  return (
    <div style={{ marginTop: 16 }}>
      <Eyebrow>Год назад в этот день</Eyebrow>
      <Card>
        <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 8, textTransform: "capitalize" }}>{fmtDay(lastYearDate)}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>

              <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>

function ruDays(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n100 >= 11 && n100 <= 14) return "дней";
  if (n10 === 1) return "день";
  if (n10 >= 2 && n10 <= 4) return "дня";
  return "дней";
}

function narrateNow(idx) {
  const type = CYCLE[idx];
  if (type === "night" && idx === 4) return "Сегодня — вторая ночная смена. После неё тебя ждёт отсыпной и 2 полноценных выходных.";
  if (type === "night") return "Сегодня — ночная смена. Впереди ещё одна ночь перед отдыхом.";
  if (type === "recovery") return "Сегодня отсыпной после ночных смен. Не лучший день для активных дел — организму нужно восстановиться.";
  if (type === "day") return "Сегодня дневная смена. Свободного времени немного — утро и поздний вечер.";
  return "Сегодня полноценный выходной — используй его по максимуму.";
}

function fmtMinutes(mins) {
  if (mins <= 0) return "меньше минуты";
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return `${m} мин`;
  if (m === 0) return `${h} ч`;
  return `${h} ч ${m} мин`;
}

// Figures out the single most relevant "what's happening / next" fact for
// right now: still on shift → time left; a scheduled event later today →
// countdown to it; vacation/trip starting soon → countdown to that; else →
// countdown to the next full rest stretch. Returns null only in the
// practically-impossible case none of these resolve.
function computeNextUp(now, events) {
  const todayReal = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const key = toKey(todayReal);
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const cover = findCover(key, events);
  const type = cover ? "off" : dayType(todayReal);

  if (!cover && (type === "day" || type === "night")) {
    const [ws, we] = WORK_HOURS[type];
    const wStart = t2m(ws), wEnd = t2m(we);
    let onShift, remain;
    if (type === "night") {
      onShift = nowMin >= wStart || nowMin < wEnd;
      remain = nowMin >= wStart ? (1440 - nowMin) + wEnd : wEnd - nowMin;
    } else {
      onShift = nowMin >= wStart && nowMin < wEnd;
      remain = wEnd - nowMin;
    }
    if (onShift) return { kind: "shiftEnd", type, remainMin: remain, endLabel: we };
  }

  const todays = events
    .filter((e) => e.date === key && e.time)
    .map((e) => ({ ...e, startMin: t2m(e.time) }))
    .filter((e) => e.startMin > nowMin)
    .sort((a, b) => a.startMin - b.startMin);
  if (todays.length) return { kind: "event", event: todays[0], remainMin: todays[0].startMin - nowMin };

  for (let i = 1; i <= 21; i++) {
    const d = addDays(todayReal, i);
    const k = toKey(d);
    const c = findCover(k, events);
    if (c && c.date === k) return { kind: "cover", cover: c, days: i };
  }

  for (let i = 0; i < 40; i++) {
    const d = addDays(todayReal, i);
    if (dayType(d) === "off" && dayType(addDays(d, 1)) === "off") return { kind: "rest", days: i };
  }
  return null;
}

function NextUpCard({ now, events }) {
  const info = useMemo(() => computeNextUp(now, events), [now, events]);
  if (!info) return null;

  let emoji, color, label, sub;
  if (info.kind === "shiftEnd") {
    const meta = TYPE_META[info.type];
    emoji = meta.emoji; color = meta.color;
    label = `До конца смены: ${fmtMinutes(info.remainMin)}`;
    sub = `${meta.label} смена · закончится в ${info.endLabel}`;
  } else if (info.kind === "event") {
    const em = EVENT_META[info.event.type];
    emoji = em.emoji; color = em.color;
    label = `${info.event.title} через ${fmtMinutes(info.remainMin)}`;
    sub = `сегодня в ${info.event.time}`;
  } else if (info.kind === "cover") {
    const em = EVENT_META[info.cover.type];
    emoji = em.emoji; color = em.color;
    label = `${em.label} через ${ruDays(info.days)}`;
    sub = info.cover.title;
  } else {
    emoji = "○"; color = C.off;
    label = info.days === 0 ? "Сегодня начинается отдых" : `Полные выходные через ${ruDays(info.days)}`;
    sub = "Ближайшая пауза в графике";
  }

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", borderRadius: 18,
      background: color + "14", border: `1px solid ${color}40`, marginBottom: 16,
    }}>
      <div style={{ fontSize: 26, flexShrink: 0 }}>{emoji}</div>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{label}</div>
        <div style={{ fontSize: 11.5, color: C.textFaint, marginTop: 1 }}>{sub}</div>
      </div>
    </div>
  );
}

function RhythmBracelet({ centerIndex, cycle }) {
  const seq = cycle || CYCLE;
  const n = seq.length;
  if (n === 0) {
    return (
      <div style={{
        background: C.surface, border: `1px solid ${C.line}`, borderRadius: 22, padding: "30px 16px",
        textAlign: "center", color: C.textFaint, fontSize: 12.5,
      }}>
        Цикл пуст — добавь хотя бы один шаг ниже
      </div>
    );
  }
  const width = 400, height = 130, cy = 60;
  const marginX = n <= 1 ? width / 2 : Math.min(40, width / (n * 1.4));
  const gap = n <= 1 ? 0 : (width - marginX * 2) / (n - 1);
  const r = Math.max(10, Math.min(22, gap ? gap * 0.4 : 22));
  const activeMeta = TYPE_META[seq[Math.min(centerIndex, n - 1)]];
  return (
    <div style={{
      background: `radial-gradient(120% 100% at 50% 0%, ${activeMeta.color}14, ${C.surface} 60%)`,
      border: `1px solid ${C.line}`, borderRadius: 22, padding: "22px 6px 16px", overflow: "hidden",
    }}>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height}>
        {n > 1 && <line x1={marginX} y1={cy} x2={width - marginX} y2={cy} stroke={C.line} strokeWidth={2} strokeDasharray="1 7" strokeLinecap="round" />}
        {seq.map((type, i) => {
          const meta = TYPE_META[type];
          const x = n <= 1 ? width / 2 : marginX + i * gap;
          const active = i === centerIndex;
          return (
            <g key={i}>
              {active && <circle cx={x} cy={cy} r={r + 9} fill="none" stroke={meta.color} strokeWidth={1.4} opacity={0.45} />}
              {active && <circle cx={x} cy={cy} r={r + 3} fill={meta.color} opacity={0.14} />}
              <circle cx={x} cy={cy} r={active ? r : r - 4} fill={active ? meta.color : meta.dim} stroke={active ? meta.color : C.line} strokeWidth={1} />
              <text x={x} y={cy + 5} textAnchor="middle" fontSize={active ? Math.min(17, r) : Math.min(13, r - 3)}>{meta.emoji}</text>
              <text x={x} y={cy + r + 20} textAnchor="middle" fontSize="9.5" fontFamily="IBM Plex Mono" fill={active ? meta.color : C.textFaint} fontWeight={active ? 700 : 400}>
                {meta.short}
              </text>
            </g>
          );
        })}
      </svg>
      <div className="f-mono" style={{ textAlign: "center", fontSize: 10.5, color: C.textFaint, letterSpacing: 0.6, marginTop: 8 }}>
        {describeCycle(seq)}
      </div>
    </div>
  );
}

function StatPill({ emoji, n, label, color }) {

/* ============================================================
   CALENDAR SCREEN
   ============================================================ */
const FILTERS = [
  { id: "work", label: "Работа" },
  { id: "task", label: "Задачи" },
  { id: "workout", label: "Тренировки" },
  { id: "trip", label: "Поездки" },
  { id: "vacation", label: "Отпуск" },
  { id: "note", label: "Заметки" },
  { id: "goal", label: "Цели" },
];

function CalendarScreen({ ctx }) {
  const { today, eventsOn } = ctx;
  const [activeFilters, setActiveFilters] = useState([]);
  const [range, setRange] = useState(60);
  const days = useMemo(() => Array.from({ length: range }, (_, i) => addDays(today, i)), [today, range]);

  function toggleFilter(id) {
    setActiveFilters((f) => (f.includes(id) ? f.filter((x) => x !== id) : [...f, id]));
  }
  function showType(t) {
    return activeFilters.length === 0 || activeFilters.includes(t);
  }
  let lastMonthLabel = null;

  return (
    <div style={{ paddingTop: 6, paddingBottom: 20 }}>
      <Eyebrow>Календарь</Eyebrow>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, paddingRight: 64 }}>
        <div className="f-display" style={{ fontSize: 19, fontWeight: 600 }}>Ближайшие дни</div>
        <div style={{ display: "flex", gap: 6 }}>
          {[30, 60, 90].map((r) => (
            <button key={r} className="press-fx" onClick={() => setRange(r)} style={{
              padding: "5px 10px", borderRadius: 999, fontSize: 11, fontWeight: 600, cursor: "pointer",
              background: range === r ? C.gold : "transparent", color: range === r ? "#1A1607" : C.textMute,
              border: `1px solid ${range === r ? C.gold : C.line}`,
            }}>{r}</button>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 16 }} className="scroller">
        {FILTERS.map((f) => {
          const active = activeFilters.includes(f.id);
          return (
            <button key={f.id} className="press-fx" onClick={() => toggleFilter(f.id)} style={{
              flexShrink: 0, padding: "6px 12px", borderRadius: 999, fontSize: 12, whiteSpace: "nowrap",
              background: active ? C.surface3 : "transparent", color: active ? C.text : C.textFaint,
              border: `1px solid ${active ? C.gold + "60" : C.line}`, cursor: "pointer", fontWeight: active ? 600 : 500,
            }}>{f.label}</button>
          );
        })}
      </div>

      {days.map((d) => {
        const key = toKey(d);
        const type = dayType(d);
        const cover = findCover(key, ctx.events);
        const meta = cover
          ? { emoji: EVENT_META[cover.type].emoji, label: `${EVENT_META[cover.type].label}: ${cover.title}`, color: EVENT_META[cover.type].color }
          : TYPE_META[type];
        const evs = eventsOn(key).filter((e) => showType(e.type) && e.id !== cover?.id);
        const workVisible = showType("work") || showType(cover?.type);
        if (!workVisible && evs.length === 0 && activeFilters.length > 0) return null;
        const isToday = key === toKey(today);
        const monthLabel = d.toLocaleDateString("ru-RU", { month: "long", year: d.getFullYear() !== today.getFullYear() ? "numeric" : undefined });
        const showMonthHeader = monthLabel !== lastMonthLabel;
        lastMonthLabel = monthLabel;
        return (
          <React.Fragment key={key}>
            {showMonthHeader && (
              <div style={{
                fontSize: 12, color: C.textFaint, textTransform: "capitalize", letterSpacing: 0.5, fontWeight: 600,
                margin: "18px 0 8px", paddingLeft: 58,
              }}>{monthLabel}</div>
            )}
          <div style={{ display: "flex", gap: 12, marginBottom: 4 }}>
            <div style={{ width: 46, flexShrink: 0, textAlign: "center", paddingTop: 12 }}>
              <div className="f-mono" style={{ fontSize: 11, color: isToday ? C.gold : C.textFaint, fontWeight: isToday ? 700 : 500 }}>
                {fmtWeekday(d)}
              </div>
              <div className="f-display" style={{ fontSize: 18, fontWeight: 700, color: isToday ? C.gold : C.text }}>
                {d.getDate()}
              </div>
              {isToday && (
                <div style={{
                  fontSize: 8, fontWeight: 700, color: "#1A1607", background: C.gold,

function InsightsBlock({ ctx }) {
  const { today, eventsOn } = ctx;
  const insights = useMemo(() => buildInsights(today, eventsOn), [today]);
  return (
    <div style={{ marginTop: 22 }}>
      <Eyebrow>Наблюдения</Eyebrow>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {insights.map((t, i) => (
          <Card key={i} style={{ display: "flex", gap: 10, padding: 12 }}>
            <Sparkles size={15} color={C.gold} style={{ flexShrink: 0, marginTop: 2 }} />
            <div style={{ fontSize: 13, color: C.text, lineHeight: 1.4 }}>{t}</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function buildInsights(today, eventsOn) {
  const out = [];
  const next14 = Array.from({ length: 14 }, (_, i) => addDays(today, i));
  const freeCount = next14.filter((d) => dayType(d) === "off").length;
  out.push(freeCount <= 2
    ? "На этой неделе у тебя мало свободного времени — старайся не перегружать вечера после смен."
    : "На ближайшие две недели у тебя достаточно свободных дней для новых планов.");

  let restStreak = 0, restStart = null;
  for (let i = 0; i < 30; i++) {
    const d = addDays(today, i);
    if (dayType(d) === "off") {
      if (restStreak === 0) restStart = i;
      restStreak++;
      if (dayType(addDays(d, 1)) !== "off") break;
    } else if (restStreak > 0) break;
  }
  if (restStreak >= 2) {
    out.push(restStart === 0
      ? `Прямо сейчас у тебя ${restStreak} ${ruDays(restStreak)} подряд — хорошее окно для отдыха.`
      : `Через ${restStart} ${ruDays(restStart)} у тебя будет ${restStreak} свободных дня подряд.`);
  }

  const hasNightSoon = Array.from({ length: 5 }, (_, i) => dayType(addDays(today, i))).includes("night");
  out.push(hasNightSoon
    ? "Скоро ночные смены — сейчас не лучший момент планировать длинную поездку."
    : "Ближайшие дни свободны от ночных смен — хорошее время для активных планов.");

  return out.slice(0, 4);
}

    if (id === "rest" || id === "trip" || id === "vacation") {

/* ============================================================
   MONTH SCREEN
   ============================================================ */
function MonthScreen({ ctx }) {
  const { today, events, shiftConfig } = ctx;
  const monthName = today.toLocaleDateString("ru-RU", { month: "long" });
  const [shareOpen, setShareOpen] = useState(false);
  const [shareMonthOffset, setShareMonthOffset] = useState(0);
  const [busy, setBusy] = useState(false);
  const stats = useMemo(() => {
    let shifts = 0, hours = 0, fullOff = 0;
    for (let i = 0; i < 30; i++) {
      const d = addDays(today, i - 4);
      const type = dayType(d);
      if (type === "day" || type === "night") { shifts++; hours += 12; }
      if (type === "off") fullOff++;
    }
    const byType = { workout: 0, task: 0, trip: 0, vacation: 0 };
    events.forEach((e) => { if (byType[e.type] !== undefined) byType[e.type]++; });
    return { shifts, hours, fullOff, ...byType };
  }, [today, events, shiftConfig]);

  const shareMonthDate = useMemo(
    () => new Date(today.getFullYear(), today.getMonth() + shareMonthOffset, 1),
    [today, shareMonthOffset]
  );
  const shareMonthLabelRaw = shareMonthDate.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
  const shareMonthLabel = shareMonthLabelRaw.charAt(0).toUpperCase() + shareMonthLabelRaw.slice(1);
  const MAX_MONTHS_AHEAD = 5;

  function openShare() {
    setShareMonthOffset(0);
    setShareOpen(true);
  }

  async function shareAsText() {
    const text = buildMonthScheduleText(shareMonthDate, events);
    if (navigator.share) {
      try { await navigator.share({ title: `График на ${shareMonthLabel}`, text }); }
      catch (e) { /* user cancelled */ }
      setShareOpen(false);
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      ctx.setToast("График скопирован — вставь в сообщение");
    } catch (e) {
      ctx.setToast("Не удалось скопировать");
    }
    setShareOpen(false);
  }

  async function shareAsImage() {
    setBusy(true);
    try {
      const blob = await renderMonthImageBlob(shareMonthDate, events, today);
      if (!blob) { ctx.setToast("Не удалось создать картинку"); return; }
      const file = new File([blob], `shift-${shareMonthLabel}.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: `График на ${shareMonthLabel}` }); }
        catch (e) { /* user cancelled */ }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `shift-${shareMonthLabel}.png`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        ctx.setToast("Картинка сохранена — прикрепи её к сообщению");
      }
    } finally {
      setBusy(false);
      setShareOpen(false);
    }
  }

  return (
    <div style={{ paddingTop: 6, paddingBottom: 20 }}>

/* ============================================================
   YEAR SCREEN — a whole year at a glance
   ============================================================ */
function YearScreen({ ctx }) {
  const { today, events, shiftConfig } = ctx;
  const [yearOffset, setYearOffset] = useState(0);
  const year = today.getFullYear() + yearOffset;

  const months = useMemo(() => {
    const out = [];
    for (let m = 0; m < 12; m++) {
      const first = new Date(year, m, 1);
      const last = new Date(year, m + 1, 0);
      const counts = { day: 0, night: 0, recovery: 0, off: 0 };
      const covers = [];
      for (let d = first; d <= last; d = addDays(d, 1)) {
        const key = toKey(d);
        const cover = findCover(key, events);
        if (cover) {
          if (!covers.find((c) => c.id === cover.id)) covers.push(cover);
        } else {
          counts[dayType(d)]++;
        }
      }
      out.push({ m, first, counts, covers });
    }
    return out;
  }, [year, events, shiftConfig]);

  const yearTotals = useMemo(() => {
    let shifts = 0, vacationDays = 0;
    months.forEach(({ counts, covers }) => {
      shifts += counts.day + counts.night;
      covers.forEach((c) => {
        if (c.type === "vacation") {
          vacationDays += Math.round((keyToDate(c.endDate) - keyToDate(c.date)) / MS_DAY) + 1;
        }
      });
    });
    return { shifts, vacationDays };
  }, [months]);

  return (
    <div style={{ paddingTop: 6, paddingBottom: 20 }}>
      <Eyebrow>Год целиком</Eyebrow>
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "space-between",
        background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: "8px 10px", marginBottom: 14,
      }}>
        <button onClick={() => setYearOffset((o) => o - 1)} style={{
          width: 32, height: 32, borderRadius: 10, border: "none", background: "transparent",
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.textMute,
        }}><ChevronLeft size={18} /></button>
        <div className="f-display" style={{ fontSize: 19, fontWeight: 700 }}>{year}</div>
        <button onClick={() => setYearOffset((o) => o + 1)} style={{
          width: 32, height: 32, borderRadius: 10, border: "none", background: "transparent",
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.textMute,
        }}><ChevronRight size={18} /></button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 18 }}>
        <StatCard label="Смен за год" big={String(yearTotals.shifts)} sub="дневных и ночных" Icon={Sun} color={C.day} />
        <StatCard label="Дней отпуска" big={String(yearTotals.vacationDays)} sub="запланировано" Icon={Palmtree} color={C.recovery} />
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {months.map(({ m, first, counts, covers }) => {
          const total = counts.day + counts.night + counts.recovery + counts.off;
          const segments = [
            { type: "day", n: counts.day },
            { type: "night", n: counts.night },
            { type: "recovery", n: counts.recovery },
            { type: "off", n: counts.off },
          ].filter((s) => s.n > 0);
          const isCurrentMonth = m === today.getMonth() && year === today.getFullYear();
          const label = first.toLocaleDateString("ru-RU", { month: "long" });
          return (
            <Card key={m} style={{ padding: 12, borderColor: isCurrentMonth ? C.gold + "55" : C.line }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: isCurrentMonth ? C.gold : C.text, textTransform: "capitalize" }}>{label}</div>
                <div style={{ fontSize: 11, color: C.textFaint }}>{counts.day + counts.night} смен · {counts.off} вых</div>
              </div>
              {total > 0 && (
                <div style={{ display: "flex", height: 7, borderRadius: 4, overflow: "hidden", background: C.surface3 }}>
                  {segments.map((s, i) => (
                    <div key={i} style={{ flex: s.n, background: TYPE_META[s.type].color }} />
                  ))}
                </div>
              )}
              {covers.length > 0 && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
                  {covers.map((c) => (
                    <div key={c.id} style={{
                      fontSize: 10.5, color: EVENT_META[c.type].color, background: EVENT_META[c.type].color + "1a",
                      border: `1px solid ${EVENT_META[c.type].color}40`, borderRadius: 999, padding: "2px 8px",
                    }}>
                      {EVENT_META[c.type].emoji} {fmtDayShort(keyToDate(c.date))}–{fmtDayShort(keyToDate(c.endDate))}
                    </div>
                  ))}
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   SETTINGS SCREEN — custom shift pattern + backup
   ============================================================ */
const CYCLE_STEP_TYPES = ["day", "night", "recovery", "off"];

function SettingsScreen({ ctx }) {
  const { shiftConfig, updateShiftConfig, exportData, importBackup, setToast, soundEnabled, setSoundEnabled, accentColor, setAccentColor } = ctx;
  const [draftCycle, setDraftCycle] = useState(shiftConfig.cycle);
  const [draftAnchor, setDraftAnchor] = useState(shiftConfig.anchorKey);
  const fileInputRef = useRef(null);
  const dirty = JSON.stringify(draftCycle) !== JSON.stringify(shiftConfig.cycle) || draftAnchor !== shiftConfig.anchorKey;

  function addStep(type) {
    if (draftCycle.length >= 21) { setToast("Слишком длинный цикл — максимум 21 шаг"); return; }
    setDraftCycle((c) => [...c, type]);
  }
  function removeStep(i) {
    setDraftCycle((c) => c.filter((_, idx) => idx !== i));
  }
  function save() {
    if (draftCycle.length === 0) { setToast("Добавь хотя бы один шаг цикла"); return; }
    if (!draftAnchor) { setToast("Укажи дату начала цикла"); return; }
    updateShiftConfig({ cycle: draftCycle, anchorKey: draftAnchor });
  }
  function resetDefault() {
    setDraftCycle([...DEFAULT_CYCLE]);
    setDraftAnchor(DEFAULT_ANCHOR_KEY);
  }

  function triggerImport() {
    fileInputRef.current?.click();
  }
  function handleImportFile(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    if (!window.confirm("Это заменит текущие события и график данными из файла. Продолжить?")) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const ok = importBackup(data);
        if (ok && data.shiftConfig) {
          setDraftCycle(data.shiftConfig.cycle);
          setDraftAnchor(data.shiftConfig.anchorKey);
        }
      } catch (err) {
        setToast("Не удалось прочитать файл — проверь формат");
      }
    };
    reader.readAsText(file);
  }

  return (
    <div style={{ paddingTop: 6, paddingBottom: 20 }}>
      <Eyebrow>Настройки</Eyebrow>
      <div className="f-display" style={{ fontSize: 19, fontWeight: 600, marginBottom: 2 }}>Мой график смен</div>
      <div style={{ fontSize: 12.5, color: C.textMute, marginBottom: 16 }}>
        Задай свою последовательность смен — приложение будет считать ритм именно по ней.
      </div>

      <RhythmBracelet centerIndex={0} cycle={draftCycle} />

      <div style={{ marginTop: 16 }}>
        <div style={{ fontSize: 12, color: C.textMute, marginBottom: 8, fontWeight: 500 }}>Последовательность (шаг 1 = дата начала)</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
          {draftCycle.map((type, i) => {
            const meta = TYPE_META[type];
            return (
              <button key={i} onClick={() => removeStep(i)} title="Убрать шаг" style={{
                display: "flex", alignItems: "center", gap: 5, padding: "6px 8px 6px 10px", borderRadius: 999,
                background: meta.dim, border: `1px solid ${meta.color}40`, cursor: "pointer",
              }}>
                <span style={{ fontSize: 13 }}>{meta.emoji}</span>
                <span style={{ fontSize: 11, color: meta.color, fontWeight: 600 }}>{i + 1}</span>
                <X size={11} color={C.textFaint} />
              </button>
            );
          })}
          {draftCycle.length === 0 && <div style={{ fontSize: 12, color: C.textFaint }}>Цикл пуст — добавь шаги ниже</div>}
        </div>
      </div>

      <div style={{ marginTop: 14 }}>
        <div style={{ fontSize: 12, color: C.textMute, marginBottom: 8, fontWeight: 500 }}>Добавить шаг</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
          {CYCLE_STEP_TYPES.map((type) => {
            const meta = TYPE_META[type];
            return (
              <button key={type} onClick={() => addStep(type)} style={{
                display: "flex", alignItems: "center", gap: 6, padding: "8px 13px", borderRadius: 10,
                background: C.surface2, border: `1px solid ${C.line}`, cursor: "pointer", color: C.text, fontSize: 12.5, fontWeight: 600,
              }}>
                <span>{meta.emoji}</span> {meta.label}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ marginTop: 14 }}>
        <Field label="Дата начала цикла (соответствует шагу 1)">
          <TextInput type="date" value={draftAnchor} onChange={setDraftAnchor} />
        </Field>
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        <button onClick={save} disabled={!dirty} style={{
          flex: 1, background: dirty ? C.gold : C.surface2, color: dirty ? "#1A1607" : C.textFaint,
          border: "none", borderRadius: 14, padding: "13px", fontSize: 14, fontWeight: 700,
          cursor: dirty ? "pointer" : "default",
        }}>
          Сохранить график
        </button>
        <button onClick={resetDefault} style={{
          display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "0 16px",
          background: C.surface2, border: `1px solid ${C.line}`, borderRadius: 14, color: C.textMute,
          fontSize: 13, fontWeight: 600, cursor: "pointer",
        }}>
          <RotateCcw size={15} /> Сбросить
        </button>
      </div>

      <div style={{ marginTop: 32 }}>
        <Eyebrow>Акцентный цвет</Eyebrow>
        <div style={{ display: "flex", gap: 10 }}>
          {ACCENT_PRESETS.map((p) => (
            <button key={p.value} className="press-fx" onClick={() => setAccentColor(p.value)} title={p.name} style={{
              width: 40, height: 40, borderRadius: 999, background: p.value, cursor: "pointer",
              border: accentColor === p.value ? `2px solid ${C.text}` : "2px solid transparent",
              boxShadow: accentColor === p.value ? `0 0 0 2px ${p.value}55` : "none",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>
              {accentColor === p.value && <Check size={16} color="#1A1607" />}
            </button>
          ))}
        </div>
      </div>

      <div style={{ marginTop: 32 }}>
        <Eyebrow>Отклик</Eyebrow>
        <button onClick={() => setSoundEnabled((v) => !v)} style={{
          display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%",
          padding: "13px 14px", borderRadius: 14, background: C.surface2, border: `1px solid ${C.line}`,
          cursor: "pointer", textAlign: "left",
        }}>
          <div>
            <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>Звук и вибрация</div>
            <div style={{ fontSize: 11.5, color: C.textFaint, marginTop: 1 }}>
              Короткий отклик при добавлении, удалении и конфликтах. На iPhone доступен только звук — вибрацию для сайтов Apple не разрешает.
            </div>
          </div>
          <div style={{
            flexShrink: 0, width: 44, height: 26, borderRadius: 999, position: "relative",
            background: soundEnabled ? C.gold : C.surface3, border: `1px solid ${soundEnabled ? C.gold : C.line}`,
            marginLeft: 12, transition: "background 0.15s ease",
          }}>
            <div style={{
              position: "absolute", top: 2, left: soundEnabled ? 20 : 2, width: 20, height: 20, borderRadius: 999,
              background: soundEnabled ? "#1A1607" : C.textFaint, transition: "left 0.15s ease",
            }} />
          </div>
        </button>
      </div>

      <div style={{ marginTop: 32 }}>
        <Eyebrow>Данные</Eyebrow>
        <div style={{ fontSize: 12.5, color: C.textMute, marginBottom: 12 }}>
          Всё хранится только в этом браузере на этом телефоне. Сделай резервную копию, если планируешь сменить устройство.
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <button onClick={exportData} style={{
            display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", borderRadius: 14,
            background: C.surface2, border: `1px solid ${C.line}`, cursor: "pointer", textAlign: "left",
          }}>
            <Download size={18} color={C.textMute} />
            <div>
              <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>Экспортировать данные</div>
              <div style={{ fontSize: 11.5, color: C.textFaint, marginTop: 1 }}>Сохранить файл с событиями и графиком</div>
            </div>
          </button>
          <button onClick={triggerImport} style={{
            display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", borderRadius: 14,
            background: C.surface2, border: `1px solid ${C.line}`, cursor: "pointer", textAlign: "left",
          }}>
            <Upload size={18} color={C.textMute} />
            <div>
              <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>Восстановить из файла</div>
              <div style={{ fontSize: 11.5, color: C.textFaint, marginTop: 1 }}>Заменит текущие данные приложения</div>
            </div>
          </button>
          <input ref={fileInputRef} type="file" accept="application/json" onChange={handleImportFile} style={{ display: "none" }} />
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ADD EVENT SHEET
   ============================================================ */
const EVENT_TYPES = ["task", "workout", "trip", "vacation", "event", "note", "goal"];

function AddEventSheet({ ctx, onClose, editEvent }) {
  const { today, commitEvent } = ctx;
  const isEdit = !!editEvent;
  const [type, setType] = useState(editEvent ? editEvent.type : null);
  const [title, setTitle] = useState(editEvent ? editEvent.title : "");
  const [date, setDate] = useState(editEvent ? editEvent.date : toKey(today));
  const [time, setTime] = useState(editEvent && editEvent.time ? editEvent.time : "");
  const [duration, setDuration] = useState(() => {
    if (!editEvent) return 30;
    if (editEvent.type === "trip" || editEvent.type === "vacation") {
      return Math.max(1, Math.round((keyToDate(editEvent.endDate) - keyToDate(editEvent.date)) / MS_DAY) + 1);
    }
    return editEvent.duration || 30;
  });
  const [noDate, setNoDate] = useState(false);
  const [allDay, setAllDay] = useState(editEvent ? !!editEvent.allDay : false);
  const [category, setCategory] = useState(editEvent ? editEvent.category || "Дом" : "Дом");
  const [repeat, setRepeat] = useState("none");
  const [suggestions, setSuggestions] = useState(null);
  const [isChecklist, setIsChecklist] = useState(!!(editEvent && editEvent.checklist && editEvent.checklist.length));
  const [checklistItems, setChecklistItems] = useState(
    editEvent && editEvent.checklist && editEvent.checklist.length
      ? editEvent.checklist
      : [{ id: crypto.randomUUID(), text: "", done: false }]
  );

  function setChecklistText(i, text) {
    setChecklistItems((items) => items.map((it, idx) => (idx === i ? { ...it, text } : it)));
  }
  function addChecklistItem() {
    setChecklistItems((items) => [...items, { id: crypto.randomUUID(), text: "", done: false }]);
  }
  function removeChecklistItem(i) {
    setChecklistItems((items) => (items.length > 1 ? items.filter((_, idx) => idx !== i) : items));
  }

  function findForNoDate() {
    const slots = findTaskSlots(duration, 7, today, ctx.eventsOn, ctx.checkConflict);
    setSuggestions(slots);
  }

  function submit() {
    if (!title.trim()) return;
    const editId = editEvent ? editEvent.id : undefined;
    const isSpan = type === "trip" || type === "vacation";

    if (isSpan) {
      const spanDays = Math.max(1, Number(duration) || 1);
      const endDate = toKey(addDays(keyToDate(date), spanDays - 1));
      commitEvent({ type, title: title.trim(), date, endDate, duration: 0, category }, { force: true, editId });
    } else if (type === "note") {
      const checklist = isChecklist
        ? checklistItems.filter((it) => it.text.trim()).map((it) => ({ ...it, text: it.text.trim() }))
        : undefined;
      commitEvent({ type: "note", title: title.trim(), date, allDay: true, category: "Заметка", checklist }, { force: true, editId });
    } else if (allDay) {
      commitEvent({ type, title: title.trim(), date, allDay: true, category }, { force: true, editId });
    } else {
      const ok = commitEvent({ type, title: title.trim(), date, time: time || undefined, duration, category }, { editId });
      if (ok && !isEdit && repeat !== "none" && time) {
        const restDates = buildRepeatDates(date, repeat).slice(1);
        if (restDates.length) {
          ctx.addMany(restDates.map((d) => ({ type, title: title.trim(), date: d, time, duration, category })));
        }
      }
    }
    onClose();
  }

  function submitFromSuggestion(s) {
    commitEvent({ type, title: title.trim() || "Задача", date: toKey(s.date), time: s.time, duration, category }, { force: true });
    onClose();
  }

/* ---- generic bottom sheet shell ---- */
function Sheet({ title, children, onClose }) {
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startY = useRef(0);

  function onDragStart(e) {
    startY.current = e.clientY;
    setDragging(true);
    e.currentTarget.setPointerCapture?.(e.pointerId);
  }
  function onDragMove(e) {
    if (!dragging) return;
    const delta = e.clientY - startY.current;
    if (delta > 0) setDragY(delta);
  }
  function onDragEnd() {
    if (!dragging) return;
    setDragging(false);
    if (dragY > 90) onClose();
    else setDragY(0);
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 70, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.55)" }} className="fade-anim" />
      <div className="sheet-anim" style={{
        position: "relative", width: "100%", maxWidth: 460, maxHeight: "85vh", overflowY: "auto",
        background: C.bg2, borderTop: `1px solid ${C.line}`, borderRadius: "22px 22px 0 0", padding: "14px 18px 28px",
        transform: dragY ? `translateY(${dragY}px)` : undefined,
        transition: dragging ? "none" : "transform 0.25s ease",
        touchAction: "none",
      }}>
        <div
          onPointerDown={onDragStart}
          onPointerMove={onDragMove}
          onPointerUp={onDragEnd}
          onPointerCancel={onDragEnd}
          style={{ cursor: "grab", paddingTop: 4, marginBottom: 10 }}
        >
          <div style={{ width: 36, height: 4, borderRadius: 3, background: C.line, margin: "0 auto 14px" }} />
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div className="f-display" style={{ fontSize: 17, fontWeight: 700 }}>{title}</div>
            <button onClick={onClose} style={{ background: C.surface2, border: "none", borderRadius: 999, width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
              <X size={15} color={C.textMute} />
            </button>
          </div>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ============================================================
   SMART SEARCH ALGORITHMS (SmartPlannerEngine)
   ============================================================ */
function findStretchWindows(len, searchDays, strict, today, eventsOn) {
  const candidates = [];
  for (let i = 0; i < searchDays - len + 1; i++) {
    const start = addDays(today, i);
    let workDays = 0, recoveryDays = 0, offDays = 0;
    for (let k = 0; k < len; k++) {
      const t = dayType(addDays(start, k));
      if (t === "day" || t === "night") workDays++;
      else if (t === "recovery") recoveryDays++;
      else offDays++;
    }
    const startType = dayType(start);
    if (strict && startType === "recovery") continue;
    let score = 100 - workDays * (strict ? 40 : 30) - recoveryDays * (strict ? 15 : 6);
    const before = dayType(addDays(start, -1)) === "off" ? 1 : 0;
    const end = addDays(start, len - 1);
    const after = dayType(addDays(end, 1)) === "off" ? 1 : 0;
    score += (before + after) * 2;
    score = Math.max(4, Math.min(100, Math.round(score)));
    if (strict && workDays > Math.ceil(len * 0.4)) continue;
    candidates.push({
      start, end, len, score, before: countFreeBefore(start), after: countFreeAfter(end),
      reasons: [
        { ok: workDays === 0, text: workDays === 0 ? "нет рабочих смен" : `${workDays} рабоч. ${ruDays(workDays)} внутри окна` },
        { ok: recoveryDays === 0, text: recoveryDays === 0 ? "не попадает на отсыпной" : "частично попадает на отсыпной" },
        { ok: before + after > 0, text: before + after > 0 ? "хорошие свободные дни рядом" : "плотный график по краям" },
      ],
    });
  }
  candidates.sort((a, b) => b.score - a.score || a.start - b.start);
  const out = [];
  for (const c of candidates) {
    if (out.some((o) => Math.abs(o.start - c.start) < len)) continue;
    out.push(c);
    if (out.length >= 3) break;
  }
  return out;

  function countFreeBefore(d) {
    let n = 0;
    for (let i = 1; i <= 5; i++) { if (dayType(addDays(d, -i)) === "off") n++; else break; }
    return n;
  }
  function countFreeAfter(d) {
    let n = 0;
    for (let i = 1; i <= 5; i++) { if (dayType(addDays(d, i)) === "off") n++; else break; }
    return n;
  }
}

const TIME_RANGES = { morning: [360, 720], day: [720, 1080], evening: [1080, 1380] };

function findWorkoutSlots(freq, duration, dayPref, timePref, today, eventsOn, checkConflict) {
  const allowedTypes = dayPref === "weekend" ? ["off"] : dayPref === "weekend_free" ? ["off", "recovery"] : ["off", "recovery", "day", "night"];
  const out = [];
  const usedDays = new Set();
  const weeks = 3;
  for (let i = 1; i < weeks * 7 && out.length < freq * weeks; i++) {
    const d = addDays(today, i);
    const key = toKey(d);
    if (usedDays.has(key)) continue;
    const type = dayType(d);
    if (!allowedTypes.includes(type)) continue;
    const base = BASE_FREE[type];
    let placed = false;
    for (const [ws, we] of base) {
      const s = t2m(ws), e = t2m(we);
      let candStart = s;
      if (timePref !== "any" && TIME_RANGES[timePref]) {
        const [ps, pe] = TIME_RANGES[timePref];
        candStart = Math.max(s, ps);
        if (candStart + duration > Math.min(e, pe)) continue;
      } else if (candStart + duration > e) continue;
      const timeStr = m2t(candStart);
      if (checkConflict(key, timeStr, duration)) continue;
      out.push({ date: d, time: timeStr });
      usedDays.add(key);
      placed = true;
      break;
    }
    if (!placed) continue;
  }
  return out.slice(0, Math.max(freq * 2, 3));
}

function findTaskSlots(duration, withinDays, today, eventsOn, checkConflict) {
  const out = [];
  for (let i = 0; i < withinDays && out.length < 5; i++) {
    const d = addDays(today, i);
    const key = toKey(d);
    const type = dayType(d);
    for (const [ws, we] of BASE_FREE[type]) {
      const s = t2m(ws), e = t2m(we);
      if (e - s < duration) continue;
      const timeStr = m2t(s);
      if (checkConflict(key, timeStr, duration)) continue;
      out.push({ date: d, time: timeStr });
      break;
    }
  }
  return out;
}

function buildRepeatDates(startKey, repeat) {
  const start = keyToDate(startKey);
  const counts = { daily: 14, weekly: 10, monthly: 6 };
  const n = counts[repeat] || 0;
  const out = [];
  for (let i = 0; i < n; i++) {
    let d;
    if (repeat === "monthly") d = new Date(start.getFullYear(), start.getMonth() + i, start.getDate());
    else if (repeat === "weekly") d = addDays(start, i * 7);
    else d = addDays(start, i);
    out.push(toKey(d));
  }
  return out;
}
